<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трекер полезных привычек</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4f46e5;
            --secondary-color: #10b981;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .main-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            margin: 20px auto;
            max-width: 1200px;
        }
        
        .navbar-custom {
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            border-radius: 20px 20px 0 0;
        }
        
        .habit-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            margin-bottom: 20px;
        }
        
        .habit-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }
        
        .habit-pleasant {
            border-left: 5px solid var(--secondary-color);
        }
        
        .habit-useful {
            border-left: 5px solid var(--primary-color);
        }
        
        .btn-custom {
            border-radius: 25px;
            padding: 10px 25px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .btn-primary-custom {
            background: linear-gradient(45deg, var(--primary-color), #6366f1);
            border: none;
            color: white;
        }
        
        .btn-primary-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(79, 70, 229, 0.4);
        }
        
        .btn-success-custom {
            background: linear-gradient(45deg, var(--secondary-color), #059669);
            border: none;
            color: white;
        }
        
        .form-control-custom {
            border-radius: 15px;
            border: 2px solid #e5e7eb;
            padding: 12px 20px;
            transition: border-color 0.3s ease;
        }
        
        .form-control-custom:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(79, 70, 229, 0.25);
        }
        
        .stats-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
        }
        
        .hidden {
            display: none !important;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
        }
        
        .spinner-border-custom {
            color: var(--primary-color);
        }
        
        .alert-custom {
            border-radius: 15px;
            border: none;
        }
        
        .public-badge {
            background: linear-gradient(45deg, var(--warning-color), #f97316);
            color: white;
            border-radius: 20px;
            padding: 5px 15px;
            font-size: 0.8em;
        }
        
        .time-badge {
            background: linear-gradient(45deg, #6b7280, #4b5563);
            color: white;
            border-radius: 15px;
            padding: 5px 12px;
            font-size: 0.85em;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="main-container">
            <!-- Navigation -->
            <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
                <div class="container-fluid">
                    <a class="navbar-brand fw-bold" href="#">
                        <i class="fas fa-seedling me-2"></i>
                        Трекер привычек
                    </a>
                    <div class="navbar-nav ms-auto">
                        <div id="auth-section">
                            <button class="btn btn-outline-light me-2" onclick="showLogin()">Войти</button>
                            <button class="btn btn-light" onclick="showRegister()">Регистрация</button>
                        </div>
                        <div id="user-section" class="hidden">
                            <span class="navbar-text me-3">
                                <i class="fas fa-user me-1"></i>
                                <span id="user-email"></span>
                            </span>
                            <button class="btn btn-outline-light me-2" onclick="showProfile()">Профиль</button>
                            <button class="btn btn-outline-light" onclick="logout()">Выйти</button>
                        </div>
                    </div>
                </div>
            </nav>

            <!-- Main Content -->
            <div class="container-fluid p-4">
                <!-- Login Form -->
                <div id="login-form" class="row justify-content-center hidden">
                    <div class="col-md-6">
                        <div class="card habit-card">
                            <div class="card-header bg-primary text-white">
                                <h4 class="mb-0"><i class="fas fa-sign-in-alt me-2"></i>Авторизация</h4>
                            </div>
                            <div class="card-body">
                                <form onsubmit="login(event)">
                                    <div class="mb-3">
                                        <label class="form-label">Email</label>
                                        <input type="email" class="form-control form-control-custom" id="login-email" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Пароль</label>
                                        <input type="password" class="form-control form-control-custom" id="login-password" required>
                                    </div>
                                    <button type="submit" class="btn btn-primary-custom btn-custom w-100">
                                        <i class="fas fa-sign-in-alt me-2"></i>Войти
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Registration Form -->
                <div id="register-form" class="row justify-content-center hidden">
                    <div class="col-md-6">
                        <div class="card habit-card">
                            <div class="card-header bg-success text-white">
                                <h4 class="mb-0"><i class="fas fa-user-plus me-2"></i>Регистрация</h4>
                            </div>
                            <div class="card-body">
                                <form onsubmit="register(event)">
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Имя</label>
                                            <input type="text" class="form-control form-control-custom" id="register-first-name">
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Фамилия</label>
                                            <input type="text" class="form-control form-control-custom" id="register-last-name">
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Username</label>
                                        <input type="text" class="form-control form-control-custom" id="register-username" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Email</label>
                                        <input type="email" class="form-control form-control-custom" id="register-email" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Пароль</label>
                                        <input type="password" class="form-control form-control-custom" id="register-password" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Подтверждение пароля</label>
                                        <input type="password" class="form-control form-control-custom" id="register-password-confirm" required>
                                    </div>
                                    <button type="submit" class="btn btn-success-custom btn-custom w-100">
                                        <i class="fas fa-user-plus me-2"></i>Зарегистрироваться
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Profile Form -->
                <div id="profile-form" class="row justify-content-center hidden">
                    <div class="col-md-6">
                        <div class="card habit-card">
                            <div class="card-header bg-info text-white">
                                <h4 class="mb-0"><i class="fas fa-user-edit me-2"></i>Профиль</h4>
                            </div>
                            <div class="card-body">
                                <form onsubmit="updateProfile(event)">
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Имя</label>
                                            <input type="text" class="form-control form-control-custom" id="profile-first-name">
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Фамилия</label>
                                            <input type="text" class="form-control form-control-custom" id="profile-last-name">
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Telegram Chat ID</label>
                                        <input type="text" class="form-control form-control-custom" id="profile-telegram-chat-id" 
                                               placeholder="Для получения уведомлений в Telegram">
                                        <div class="form-text">
                                            <i class="fas fa-info-circle me-1"></i>
                                            Напишите боту @YourHabitBot команду /start для получения Chat ID
                                        </div>
                                    </div>
                                    <button type="submit" class="btn btn-primary-custom btn-custom w-100">
                                        <i class="fas fa-save me-2"></i>Сохранить
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Main Dashboard -->
                <div id="dashboard" class="hidden">
                    <!-- Stats -->
                    <div class="row mb-4">
                        <div class="col-md-3">
                            <div class="stats-card">
                                <i class="fas fa-list-check fa-2x mb-2"></i>
                                <h3 id="total-habits">0</h3>
                                <p class="mb-0">Всего привычек</p>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="stats-card">
                                <i class="fas fa-heart fa-2x mb-2"></i>
                                <h3 id="pleasant-habits">0</h3>
                                <p class="mb-0">Приятных</p>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="stats-card">
                                <i class="fas fa-globe fa-2x mb-2"></i>
                                <h3 id="public-habits">0</h3>
                                <p class="mb-0">Публичных</p>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="stats-card">
                                <i class="fas fa-clock fa-2x mb-2"></i>
                                <h3 id="avg-time">0</h3>
                                <p class="mb-0">Среднее время (мин)</p>
                            </div>
                        </div>
                    </div>

                    <!-- Navigation Tabs -->
                    <ul class="nav nav-pills mb-4" role="tablist">
                        <li class="nav-item">
                            <button class="nav-link active btn-custom" onclick="showMyHabits()">
                                <i class="fas fa-list me-2"></i>Мои привычки
                            </button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link btn-custom" onclick="showPublicHabits()">
                                <i class="fas fa-globe me-2"></i>Публичные привычки
                            </button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link btn-custom" onclick="showAddHabit()">
                                <i class="fas fa-plus me-2"></i>Добавить привычку
                            </button>
                        </li>
                    </ul>

                    <!-- Add Habit Form -->
                    <div id="add-habit-form" class="hidden">
                        <div class="card habit-card">
                            <div class="card-header bg-success text-white">
                                <h4 class="mb-0"><i class="fas fa-plus me-2"></i>Новая привычка</h4>
                            </div>
                            <div class="card-body">
                                <form onsubmit="addHabit(event)">
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Действие *</label>
                                            <input type="text" class="form-control form-control-custom" id="habit-action" 
                                                   placeholder="Например: Выпить стакан воды" required>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Место *</label>
                                            <input type="text" class="form-control form-control-custom" id="habit-place" 
                                                   placeholder="Например: Кухня" required>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">Время *</label>
                                            <input type="time" class="form-control form-control-custom" id="habit-time" required>
                                        </div>
                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">Время выполнения (сек) *</label>
                                            <input type="number" class="form-control form-control-custom" id="habit-execution-time" 
                                                   min="1" max="120" placeholder="60" required>
                                        </div>
                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">Периодичность (дни) *</label>
                                            <select class="form-control form-control-custom" id="habit-periodicity" required>
                                                <option value="1">Ежедневно</option>
                                                <option value="2">Через день</option>
                                                <option value="3">Каждые 3 дня</option>
                                                <option value="7">Еженедельно</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" id="habit-is-pleasant" onchange="togglePleasantHabit()">
                                                <label class="form-check-label" for="habit-is-pleasant">
                                                    Приятная привычка
                                                </label>
                                            </div>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" id="habit-is-public">
                                                <label class="form-check-label" for="habit-is-public">
                                                    Публичная привычка
                                                </label>
                                            </div>
                                        </div>
                                    </div>
                                    <div id="reward-section">
                                        <div class="row">
                                            <div class="col-md-6 mb-3">
                                                <label class="form-label">Вознаграждение</label>
                                                <input type="text" class="form-control form-control-custom" id="habit-reward" 
                                                       placeholder="Например: Съесть конфету">
                                            </div>
                                            <div class="col-md-6 mb-3">
                                                <label class="form-label">Связанная привычка</label>
                                                <select class="form-control form-control-custom" id="habit-related">
                                                    <option value="">Выберите приятную привычку</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                    <button type="submit" class="btn btn-success-custom btn-custom">
                                        <i class="fas fa-plus me-2"></i>Создать привычку
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>

                    <!-- My Habits -->
                    <div id="my-habits">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h4><i class="fas fa-list me-2"></i>Мои привычки</h4>
                            <div class="btn-group">
                                <button class="btn btn-outline-primary btn-sm" onclick="filterHabits('all')">Все</button>
                                <button class="btn btn-outline-primary btn-sm" onclick="filterHabits('useful')">Полезные</button>
                                <button class="btn btn-outline-primary btn-sm" onclick="filterHabits('pleasant')">Приятные</button>
                            </div>
                        </div>
                        <div id="habits-list" class="row">
                            <!-- Habits will be loaded here -->
                        </div>
                        <div id="habits-pagination" class="d-flex justify-content-center mt-4">
                            <!-- Pagination will be loaded here -->
                        </div>
                    </div>

                    <!-- Public Habits -->
                    <div id="public-habits" class="hidden">
                        <h4 class="mb-3"><i class="fas fa-globe me-2"></i>Публичные привычки</h4>
                        <div id="public-habits-list" class="row">
                            <!-- Public habits will be loaded here -->
                        </div>
                        <div id="public-habits-pagination" class="d-flex justify-content-center mt-4">
                            <!-- Pagination will be loaded here -->
                        </div>
                    </div>
                </div>

                <!-- Loading -->
                <div id="loading" class="loading">
                    <div class="spinner-border spinner-border-custom" role="status">
                        <span class="visually-hidden">Загрузка...</span>
                    </div>
                    <p class="mt-3">Загрузка...</p>
                </div>

                <!-- Alerts -->
                <div id="alerts-container" class="position-fixed top-0 end-0 p-3" style="z-index: 1050;">
                    <!-- Alerts will be shown here -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
